version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: recruitflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruitflow
      POSTGRES_PASSWORD: recruitflow
      POSTGRES_DB: recruitflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: recruitflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
